    if(!useOrig&&map[k]){c=cache[k]||(cache[k]=rgb(map[k]));out.data[o]=c[0];out.data[o+1]=c[1];out.data[o+2]=c[2];}
    else{out.data[o]=src[i];out.data[o+1]=src[i+1];out.data[o+2]=src[i+2];}
    out.data[o+3]=255;}
  ctx.putImageData(out,0,0);
}
function build(){const L=document.getElementById('lista');L.innerHTML='';
  DATA.forEach(g=>{const h=document.createElement('h2');h.textContent=g.g+' ('+g.items.length+')';L.appendChild(h);
    g.items.forEach(it=>{const r=document.createElement('div');r.className='row';
      r.innerHTML='<span class="sw" style="background:'+it.o+'" title="original '+it.o+'"></span><span>→</span><input type="color" value="'+map[it.o]+'"><code>'+map[it.o]+'</code><span class="pct">'+it.n+'%</span>';
      const inp=r.querySelector('input'),cd=r.querySelector('code');
      inp.addEventListener('input',()=>{map[it.o]=gba(inp.value);cd.textContent=map[it.o];draw(false)});
      L.appendChild(r);});});}
